[project]
name = "kubernetes-fastapi-storage-service"
version = "0.2.0"
description = "JSON-objects storage service designed to run in a Kubernetes cloud environment"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Maxim Barannikov", email = "barannikov.mu@gmail.com" },
]
keywords = ["fastapi", "kubernetes", "json-storage", "prometheus", "structlog", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "fastapi-healthchecks>=1.0.7",
    "aiocache>=0.12.3",
    "aiofiles>=24.1.0",
    "orjson>=3.10.0",
    "apscheduler>=3.10.4,<4",
]

[project.scripts]
start = "storage_service.main:start"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "types-aiofiles>=24.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storage_service"]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "W",        # pycodestyle
    "F",             # pyflakes
    "A",             # flake8-builtins
    "B",             # flake8-bugbear
    "COM",           # flake8-commas
    "C4",            # flake8-comprehensions
    "Q",             # flake8-quotes
    "SIM",           # flake8-simplify
    "PTH",           # flake8-use-pathlib
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "S",             # bandit
    "TID",           # flake8-tidy-imports
    "ICN",           # flake8-import-conventions
    "ISC",           # flake8-implicit-str-concat
    "TCH",           # flake8-type-checking
    "INT",           # flake8-gettext
    "YTT",           # flake8-2020
    "FA",            # flake8-future-annotations
    "C90",           # mccabe
    "PIE",           # flake8-pie
    "RSE",           # flake8-raise
    "PGH",           # pygrep-hooks
    "D201", "D204", "D206", "D207", "D208", "D209", "D210",
    "D211", "D213", "D300", "D301", "D402", "D412", "D414",
]
ignore = [
    "E501",          # line length is enforced by the formatter
    "S104",          # binding to 0.0.0.0 is acceptable inside containers
    "Q000", "Q003",  # quote style is owned by `ruff format`
    "COM812",        # conflicts with ruff format
    "ISC001",        # conflicts with ruff format
]

[tool.ruff.lint.flake8-import-conventions.aliases]
typing = "t"

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"storage_service/tests/**/*.py" = [
    "S101",  # asserts allowed in tests
]


[tool.mypy]
python_version = "3.12"
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pydantic-mypy]
warn_untyped_fields = true


[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-ra --strict-markers --cov=storage_service --cov-report=term-missing --cov-fail-under=85"
testpaths = ["storage_service/tests"]


[tool.coverage.run]
branch = true
source = ["storage_service"]
omit = [
    "storage_service/tests/*",
    "storage_service/main.py",
    "storage_service/tasks/run_scheduler.py",
    "storage_service/settings/scheduler.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
