# kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace/ns.yaml
  # Cluster-scoped; applied before the namespaced objects that depend on them.
  - fastapi/sc.yaml
  - fastapi/pv.yaml
  - fastapi/pvc.yaml
  - fastapi/configmap.yaml
  - fastapi/deployment.yaml
  - fastapi/service.yaml
  - fastapi/networkpolicy.yaml

images:
  - name: honeyleach/fastapi-storage-service
    newTag: "0.2.0"
