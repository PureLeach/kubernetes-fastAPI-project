# Cluster-scoped, so no namespace. A local volume is pinned to one node:
# set nodeAffinity to a node from `kubectl get nodes` and create the directory
# there first, as a local PV will not create it. See the README.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-service-pv
  labels:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/part-of: storage-service
spec:
  capacity:
    storage: 64Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-service-local
  local:
    path: /mnt/storage-service
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube
