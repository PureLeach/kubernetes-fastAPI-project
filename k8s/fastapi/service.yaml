# NodePort keeps this reachable on a single-node cluster; a real deployment
# would front it with an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: fastapi-storage-service
  labels:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/part-of: storage-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/instance: storage-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
      nodePort: 31001
