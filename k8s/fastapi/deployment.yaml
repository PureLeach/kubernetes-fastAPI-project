apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-storage-service-deployment
  namespace: fastapi-storage-service
  labels:
    app: storage-service
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service-app
  template:
    metadata:
      labels:
        app: storage-service-app
        app.kubernetes.io/name: storage-service
        app.kubernetes.io/version: "0.2.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi-storage-service-container
          image: honeyleach/fastapi-storage-service:0.2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: fastapi-storage-service-secret
          volumeMounts:
            - name: fastapi-storage-service-storage-class
              mountPath: /app/mnt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              port: http
              path: /probes/liveness
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              port: http
              path: /probes/readiness
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: http
              path: /probes/liveness
            periodSeconds: 15
      volumes:
        - name: fastapi-storage-service-storage-class
          persistentVolumeClaim:
            claimName: fastapi-storage-service-pvc
