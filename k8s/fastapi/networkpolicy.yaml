# Default-deny ingress, then re-open the API port. Needs a CNI that enforces
# NetworkPolicy (Calico, Cilium); plain minikube accepts but ignores these.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-service-default-deny
  namespace: fastapi-storage-service
  labels:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/part-of: storage-service
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-service-allow-http
  namespace: fastapi-storage-service
  labels:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/part-of: storage-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storage-service
      app.kubernetes.io/instance: storage-service
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
