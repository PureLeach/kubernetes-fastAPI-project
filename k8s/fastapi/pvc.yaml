apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-service-pvc
  namespace: fastapi-storage-service
  labels:
    app.kubernetes.io/name: storage-service
    app.kubernetes.io/instance: storage-service
    app.kubernetes.io/part-of: storage-service
spec:
  # Required: omitting this falls back to the cluster's default StorageClass
  # rather than matching any class, binding the claim to the wrong volume.
  storageClassName: storage-service-local
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 32Mi
