services:
  fastapi:
    container_name: ${COMPOSE_PROJECT_NAME:-storage_service}_fastapi
    build:
      context: ./
    image: ${COMPOSE_PROJECT_NAME:-storage_service}:local
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
    # Optional: the image has working defaults, so a fresh clone runs without it.
    env_file:
      - path: .env
        required: false
    volumes:
      - storage-data:/app/mnt
    # Shutdown writes the snapshot.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage-data:
