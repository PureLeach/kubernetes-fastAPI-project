name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.31"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy --config-file=pyproject.toml .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: pytest
        run: uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Image build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: storage-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Checks the entrypoint, non-root user and probes in the image itself.
        run: |
          docker run -d --name smoke -p 8000:8000 storage-service:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/probes/readiness >/dev/null && break
            sleep 1
          done
          curl -fsS -X PUT http://localhost:8000/v1/objects/ci \
               -H 'Content-Type: application/json' -d '{"ok":true}'
          test "$(curl -fsS http://localhost:8000/v1/objects/ci)" = '{"ok":true}'
          test "$(docker exec smoke id -u)" = "1001"
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: storage-service:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render with kustomize
        run: kubectl kustomize k8s > rendered.yaml

      - name: Validate against the Kubernetes schema
        uses: docker://ghcr.io/yannh/kubeconform:latest-alpine
        with:
          args: -strict -summary -kubernetes-version 1.30.0 /github/workspace/rendered.yaml
